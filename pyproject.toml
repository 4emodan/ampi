[project]
name = "claude-assistant"
version = "0.1.0"
description = "Telegram bridge that runs a personal assistant on the official Claude Code CLI (claude -p)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
# Only the tg-reader daemon (separate tgreader user) needs Telethon.
reader = ["telethon>=1.40,<2", "qrcode>=7.4"]

[project.scripts]
claude-assistant = "assistant_bridge.main:main"
tg-read = "tg_reader.client:main"
tg-reader = "tg_reader.server:main"
todoist = "ampi_tools.client:todoist_main"
gmail = "ampi_tools.client:gmail_main"
youtube = "ampi_tools.client:youtube_main"
threads = "ampi_tools.client:threads_main"
instagram = "ampi_tools.client:instagram_main"
browse = "ampi_tools.client:browse_main"
telegram = "ampi_tools.client:telegram_main"
maps = "ampi_tools.client:maps_main"
wolt = "ampi_tools.client:wolt_main"
info = "ampi_tools.client:info_main"
checkout = "ampi_tools.client:checkout_main"
payment = "ampi_tools.client:payment_main"
ampi-tools = "ampi_tools.server:main"
watchers = "assistant_bridge.watch.cli:main"

[dependency-groups]
dev = ["pytest>=8", "tzdata>=2024.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant_bridge", "src/tg_reader", "src/ampi_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
