[project]
name = "claude-assistant"
version = "0.1.0"
description = "Telegram bridge that runs a personal assistant on the official Claude Code CLI (claude -p)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.scripts]
claude-assistant = "assistant_bridge.main:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
