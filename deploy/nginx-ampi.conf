# The Ampi dashboard: HTTPS, only /ampi/ (deploy/install-dash.sh)
server {
    listen 443 ssl default_server;
    server_name @HOST@;
    server_tokens off;
    ssl_certificate /etc/letsencrypt-ampi/live/ampi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-ampi/live/ampi/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    access_log off;
    error_log /var/log/nginx/ampi.error.log;
    client_max_body_size 16k;
    client_header_timeout 10s;
    client_body_timeout 10s;

    location = /ampi { return 302 https://@HOST@/ampi/; }
    location /ampi/ {
        limit_req zone=ampi burst=40 nodelay;
        limit_conn ampic 10;
        proxy_pass http://unix:/run/ampi-dash.sock:/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_read_timeout 30s;
        proxy_intercept_errors off;
    }
    location / { return 404; }
}
