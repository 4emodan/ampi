# Approval policy for ampi-tools. Only root and the ampitools user can change this file;
# the assistant can't. Restart after editing: systemctl restart ampi-tools
#
# Critical operations wait for your Approve/Reject in Telegram:
#   todoist.update, todoist.move, todoist.complete, todoist.reopen, todoist.delete,
#   gmail.send, gmail.send_draft, gmail.trash, gmail.delete_label,
#   youtube.remove, youtube.subscribe, youtube.unsubscribe (always ask),
#   youtube.add to a playlist that isn't private (always asks),
#   threads.publish, threads.delete, instagram.reply, instagram.delete_comment (always ask),
#   threads.hide/unhide, instagram.hide/unhide
# gmail.send, gmail.send_draft, gmail.trash and todoist.delete always ask, whatever is set here.

# Critical operations to allow without asking, e.g. once you trust its inbox triage:
auto_approve = []
# auto_approve = ["todoist.move", "todoist.update"]

# Safe operations you want to approve anyway, e.g. archiving email or creating YouTube playlists:
require_approval = []
# require_approval = ["gmail.archive"]

# Telegram messages Ampi writes AS YOU (docs/SETUP.md 7b). Without a rule here, every send/edit/delete is a
# one-time request you approve (or "✅ + always here" for 30 days). Telegram writes can't go in auto_approve.
[telegram]
default = "ask"            # "never": Ampi can't even ask, except in chats allowed below
# [[telegram.chats]]
# chat = 123456789         # id from `tg-read chats`; "me" = your Saved Messages
# name = "Anna"            # a label for you
# allow = ["send"]         # "send" and/or "edit" (edit: Ampi's own message within 10 min); deleting always asks
# [[telegram.chats]]
# chat = -1001234567890
# never = true
