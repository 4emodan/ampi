name = "instagram-dms"
description = "New Instagram direct messages, summarized for you every 15 minutes (not at night)"

# Every 15 minutes is 4 inbox reads an hour, well inside the watchers' 30 reads/hour for the session.
# `instagram dms` in chat (or /watcher instagram-dms → Run) checks now.
[[triggers]]
type = "time.every"
minutes = 15

[limits]
runs_per_day = 120
llm_calls_per_day = 60
actions_per_day = 0

# The daemon reads the inbox (no AI, nothing marked as seen; message requests and groups you never wrote in are
# left out). It stops the run quietly in quiet hours (home timezone), when nothing is new, or while the session is
# paused.
[[steps]]
id = "inbox"
type = "adapter"
op = "igweb.inbox"
args = { quiet = "23:00-08:00" }

# Each new message is reported once.
[[steps]]
id = "fresh"
type = "script"
run = "lib/dedupe"
args = { field = "steps.inbox.key", file = "dms-seen.txt" }

# An AI without any tools reads the messages (as untrusted data) and answers in a fixed form.
[[steps]]
id = "summary"
type = "llm"
model = "haiku"
prompt = "prompts/dms.md"
input = "{{steps.inbox.text}}"
schema = { worth = ["yes", "no"], summary = "text:1500" }

# Markdown, so text from the messages can't form links or code in the message to you.
[[steps]]
id = "send"
type = "notify"
format = "markdown"
template = "templates/dms.txt"
when = { path = "steps.summary.worth", equals = "yes" }
