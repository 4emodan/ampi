name = "instagram-dms"
description = "New Instagram direct messages, summarized for you every 15 minutes (not at night)"

# Every 15 minutes is 4 inbox reads an hour, well inside the watchers' 30 reads/hour for the session.
# `instagram dms` in chat (or /watcher instagram-dms → Run) checks now.
[[triggers]]
type = "time.every"
minutes = 15

[limits]
runs_per_day = 120
llm_calls_per_day = 60
actions_per_day = 0

# The daemon reads the inbox (no AI, nothing marked as seen; message requests and groups you never wrote in are
# left out). It stops the run quietly in quiet hours (home timezone; only Run in /watcher checks anyway), when
# nothing is unread, or while the session is paused.
[[steps]]
id = "inbox"
type = "adapter"
op = "igweb.inbox"
args = { quiet = "23:00-08:00", manual = "{{item.owner}}" }

# The messages not reported yet, oldest first, in bounded batches (a big backlog takes several runs).
[[steps]]
id = "fresh"
type = "script"
run = "scripts/new_only"
args = { threads = "{{steps.inbox.threads}}", more_threads = "{{steps.inbox.more_threads}}", test = "{{steps.inbox.test}}" }

# An AI without any tools reads the messages (as untrusted data) and answers in a fixed form. It can't hold a report
# back: the owner always hears how many messages there are.
[[steps]]
id = "summary"
type = "llm"
model = "haiku"
prompt = "prompts/dms.md"
input = "{{steps.fresh.text}}"
schema = { summary = "text:3000" }
when = { path = "steps.fresh.plain", false = true }

[[steps]]
id = "answered"
type = "script"
run = "scripts/answered"
when = { path = "steps.fresh.plain", false = true }

# Markdown, so text from the messages can't form links, code or addresses in the message to you.
[[steps]]
id = "send"
type = "notify"
format = "markdown"
template = "templates/dms.txt"
when = { path = "steps.fresh.plain", false = true }

# A batch that failed twice at the AI step (or kept failing to send) is only counted, without its text.
[[steps]]
id = "send_count"
type = "notify"
format = "markdown"
template = "templates/count.txt"
when = { path = "steps.fresh.plain", true = true }

# Only now are these messages counted as reported: if anything above fails they are reported again, never lost.
# (Going back to an older version of this watcher: it can't read this file, so its runs fail without losing anything;
# approve this version again.)
[[steps]]
id = "commit"
type = "script"
run = "scripts/commit"
args = { commit = "{{steps.fresh.commit}}" }
